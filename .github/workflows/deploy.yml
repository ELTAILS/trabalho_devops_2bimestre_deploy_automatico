name: Deploy na VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar dependências (Composer)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/app -w /app composer:2 install --no-dev --optimize-autoloader

      - name: Atualizar aplicação
        run: docker compose up -d --remove-orphans
